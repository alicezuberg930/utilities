name: utilities

services:
  # app:
  #   restart: unless-stopped
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile

  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=utilities;Username=admin;Password=123456
  #     Database__MigrateOnStartup: "true"
  #     Youtube__ExecutablePath: /usr/local/bin/yt-dlp
  #     Youtube__JobsDirectory: /tmp/jobs

  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "4000:8080"

  #   volumes:
  #     - youtube-jobs:/tmp/jobs

  #   networks:
  #     - app-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    stop_signal: SIGTERM
    stop_grace_period: 60s

    environment:
      POSTGRES_DB: utilities
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d utilities" ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    stop_signal: SIGTERM
    stop_grace_period: 30s

    command: [ "redis-server", "--appendonly", "yes" ]

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-net

volumes:
  postgres-data:
  redis-data:
  youtube-jobs:

networks:
  app-net:
    name: app-net
