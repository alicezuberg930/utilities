name: utilities

services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=utilities;Username=admin;Password=123456
      Database__MigrateOnStartup: "true"
      Youtube__ExecutablePath: /usr/local/bin/yt-dlp
      Youtube__JobsDirectory: /tmp/jobs
      FileConversion__FfmpegExecutablePath: /usr/bin/ffmpeg
      FileConversion__FfprobeExecutablePath: /usr/bin/ffprobe
      FileConversion__MaxUploadFileBytes: 268435456
      FileConversion__MaxUploadRequestBytes: 269484032
      FileConversion__CadConverterExecutablePath: /usr/local/bin/utilities-cad-converter
      FileConversion__PdfDocxConverterExecutablePath: /usr/local/bin/python3
      FileConversion__PdfDocxConverterScriptPath: /opt/utilities-pdf-docx-converter/worker.py
      FileConversion__JobsDirectory: /tmp/convert-jobs
      FileConversion__CadMaxEntities: 500000
      FileConversion__CadMaxVertices: 8000000
      FileConversion__CadMaxTriangles: 4000000
      FileConversion__CadMaxLineSegments: 4000000

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:8080"

    volumes:
      - youtube-jobs:/tmp/jobs
      - convert-jobs:/tmp/convert-jobs

    networks:
      - app-utilities

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    stop_signal: SIGTERM
    stop_grace_period: 60s

    environment:
      POSTGRES_DB: utilities
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5436:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d utilities" ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app-utilities

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    stop_signal: SIGTERM
    stop_grace_period: 30s

    command: [ "redis-server", "--appendonly", "yes" ]

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-utilities

volumes:
  postgres-data:
  redis-data:
  youtube-jobs:
  convert-jobs:

networks:
  app-utilities:
    name: app-utilities
